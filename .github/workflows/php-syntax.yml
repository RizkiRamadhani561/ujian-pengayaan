name: PHP syntax
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli
      - name: Check PHP syntax
        run: find app public tests -name '*.php' -print0 | xargs -0 -n1 php -l
